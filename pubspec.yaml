name: markdownr
description: A Markdown viewer/editor app.

# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
version: 1.0.0+1

environment:
  sdk: ">=2.17.0 <3.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  # Atualize as bibliotecas problemáticas
  charset_converter: ^2.1.2  # Versão atualizada
  fluttertoast: ^8.2.4      # Versão atualizada
  
  # Mantenha as demais dependências que você tem no projeto
  # ...

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  # Para adicionar assets ao seu aplicativo, adicione uma seção assets:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

